[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-abc"
version = "0.1.0"
description = "Auditable budget-aware research agent with task harness and evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0"]
speedup = ["numpy>=1.24"]
tabular = ["numpy>=1.24", "pandas>=2.0", "lightgbm>=4.0", "autogluon.tabular>=1.0"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_agent*", "library*", "evaluation*", "dashboard*", "skill_layer*", "pilot*", "scripts*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools]
py-modules = ["harness", "harness_worker", "tabular_harness", "tabular_worker", "ledger"]

[tool.setuptools.package-data]
dashboard = ["index.html"]
