name: Hourly roadshow report

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-roadshow-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate report from committed repository content
        run: python scripts/generate_roadshow_report.py
      - name: Commit changed report
        run: |
          if git diff --quiet -- docs/路演汇报.html; then
            echo "No repository changes to report"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/路演汇报.html
          git commit -m "Update hourly roadshow report"
          git push
